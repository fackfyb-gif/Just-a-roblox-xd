name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install MinGW
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - name: Compile to EXE
      run: |
        x86_64-w64-mingw32-g++ main.cpp -o script.exe -static -O2

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v3
      with:
        name: RobloxScriptEXE
        path: script.exe
